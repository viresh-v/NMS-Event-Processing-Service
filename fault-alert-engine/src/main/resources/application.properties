# ===============================
# Application
# ===============================
spring.application.name=fault-alert-engine
server.port=8083
spring.profiles.active=local
#spring.profiles.active=docker

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/fault-alert-engine
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Kafka Consumer
# ===============================
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fault-alert-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.hcl.faultalertengine.dto.DeviceEvent

# Topic Name
kafka.topic.validated-events=validated-events

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ===============================
# Logging
# ===============================
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# CPU Thresholds
# ===============================
rules.cpu.warning=70
rules.cpu.major=80
rules.cpu.critical=90

# ===============================
# Memory Thresholds
# ===============================
rules.memory.warning=70
rules.memory.major=85
rules.memory.critical=95

# ===============================
# Active Connections Thresholds
# ===============================
rules.connection.warning=1000
rules.connection.major=5000
rules.connection.critical=10000